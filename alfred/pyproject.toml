[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred"
version = "0.1.0"
description = "Alfred — assistente pessoal WhatsApp (Dutch market)"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # DB / ORM
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # LLM
    "anthropic>=0.40",
    # Utilities
    "structlog>=24.2",
    "python-dateutil>=2.9",  # task due dates (conversation.py)
    "tzdata>=2024.1",        # Europe/Amsterdam on slim images
]

[project.optional-dependencies]
prod = []
bedrock = ["boto3>=1.34"]  # only when LLM_PROVIDER=bedrock
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "sqlalchemy[mypy]>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
