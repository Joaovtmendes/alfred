# ── Web service (main) ──────────────────────────────────────────────────────
[build]
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash /app/start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"

# ── Cron service "alfred-cron" ───────────────────────────────────────────────
# Uses its own config file: alfred/railway.cron.toml (set it in that service's
# Settings → Config-as-code). Variables: reference the web service, e.g.
# DATABASE_URL=${{alfred-web.DATABASE_URL}}, WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID,
# TIMEZONE, CRON_INTERVAL_MINUTES.
